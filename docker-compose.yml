services:
  cmms-db:
    image: postgres:18-alpine
    container_name: cmms-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cmms_db
    ports:
      - "5432:5432"
    volumes:
      - cmms_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cmms-network

  cmms-api:
    build:
      context: ./cmms-api
      dockerfile: Dockerfile
    container_name: cmms-api
    ports:
      - "5020:5020"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5020
      - ConnectionStrings__PostgresConnection=Host=cmms-db;Port=5432;Database=cmms_db;Username=postgres;Password=postgres
    depends_on:
      cmms-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cmms-network

  cmms-web:
    build:
      context: ./cmms-web
      dockerfile: Dockerfile
    container_name: cmms-web
    ports:
      - "3002:3002"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5020
    depends_on:
      - cmms-api
    restart: unless-stopped
    networks:
      - cmms-network

volumes:
  cmms_postgres_data:

networks:
  cmms-network:
    driver: bridge
